description: "A standard collection an integration type offers. Not an ordinary collection: it lives under the type, and a name without ':' does not find it."
pathTemplate: "${project}/versions/${version}/integration_types/${integration_type}/collections/${name}"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  # The integration type's name. Not `type`: a field's scalar type owns that property.
  integration_type:
    type: slug
    createOnly: true
  name:
    type: slug
    createOnly: true
  label:
    type: string
  label_plural:
    type: string
