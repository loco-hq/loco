description: "A field of a standard collection. Fields belong to the type's owner."
pathTemplate: "${project}/versions/${version}/integration_types/${integration_type}/fields/${collection}/${name}"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  integration_type:
    type: slug
    createOnly: true
  collection:
    type: slug
    createOnly: true
  name:
    type: slug
    createOnly: true
  type:
    type: string
  label:
    type: string
  required:
    type: boolean
  # Same `{ value, label }` shape as a field option. Not `field_option`:
  # codegen emits one struct per object name.
  options:
    type: list
    items:
      type: object
      name: type_field_option
      properties:
        value:
          type: string
        label:
          type: string
