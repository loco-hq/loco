description: "A custom collection one integration declares. Not a collection of the type, and not an ordinary collection of the same name."
pathTemplate: "${project}/versions/${version}/integrations/${integration}/collections/${name}"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  integration:
    type: slug
    createOnly: true
  name:
    type: slug
    createOnly: true
  label:
    type: string
  label_plural:
    type: string
