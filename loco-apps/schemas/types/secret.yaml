description: "A named secret a version needs. The declaration only — never the value."
pathTemplate: "${project}/versions/${version}/secrets/${name}"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  name:
    type: slug
    createOnly: true
  label:
    type: string
  description:
    type: string
  # The version cannot run until a store sets this secret. The value itself
  # is not stored on the declaration, and neither is a default: a value
  # shipped in a package is not secret.
  required:
    type: boolean
