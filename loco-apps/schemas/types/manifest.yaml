description: "A versioned project manifest declaring dependencies and the permission sets assigned to public"
pathTemplate: "${project}/versions/${version}/manifest"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  dependencies:
    type: list
    items: string
  public_permission_sets:
    type: list
    items: string
