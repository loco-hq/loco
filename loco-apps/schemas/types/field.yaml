description: "A field belonging to a collection"
pathTemplate: "${project}/versions/${version}/fields/${collection}/${name}"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  collection:
    type: slug
    createOnly: true
  name:
    type: slug
    createOnly: true
  type:
    type: string
  label:
    type: string
  # The allowed values of a string field. Empty means any string. /data
  # writes reject a value that is not one of them (invalid_option).
  options:
    type: list
    items:
      type: object
      name: field_option
      properties:
        value:
          type: string
        label:
          type: string
