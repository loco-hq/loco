description: "A field belonging to a collection"
pathTemplate: "${project}/versions/${version}/fields/${collection}/${name}"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  collection:
    type: slug
    createOnly: true
  name:
    type: slug
    createOnly: true
  type:
    type: string
  label:
    type: string
  # A /data create must give the field a value: missing, null, and (for a
  # string) "" are errors (kind required). An update checks it only when the
  # patch names the field; reads report a gap as a warning.
  required:
    type: boolean
  # The allowed values of a string field. Empty means any string. /data
  # writes reject a value that is not one of them (invalid_option).
  options:
    type: list
    items:
      type: object
      name: field_option
      properties:
        value:
          type: string
        label:
          type: string
