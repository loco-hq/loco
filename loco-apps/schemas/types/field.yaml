description: "A field belonging to a collection"
filePathTemplate: "${project}/versions/${version}/fields/${collection}/${name}.yaml"
properties:
  project:
    type: slug
    segments: 2
    createOnly: true
  version:
    type: slug
    createOnly: true
  collection:
    type: slug
    createOnly: true
  name:
    type: slug
    createOnly: true
  type:
    type: string
