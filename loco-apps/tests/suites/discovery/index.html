<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Reading list</title></head>
<body>
<h1>discovery page</h1>
<p id="status"></p>
<form id="login">
<label>Handle <input name="username" required></label>
<label>Password <input name="password" type="password" required></label>
<button>Log in</button>
</form>
<button id="logout" type="button" hidden>Log out</button>
<ul id="books"></ul>
<form id="add" hidden>
<label>Title <input name="title" required></label>
<label>Author <input name="author" required></label>
<button>Add</button>
</form>
<script>
const key = "loco_session:same-origin";
const list = document.getElementById("books");
const status = document.getElementById("status");
const loginForm = document.getElementById("login");
const addForm = document.getElementById("add");
const logoutButton = document.getElementById("logout");
const token = () => localStorage.getItem(key);
function headers(json) {
  const h = {};
  if (token()) h["Authorization"] = "Bearer " + token();
  if (json) h["Content-Type"] = "application/json";
  return h;
}
function signedIn(on) {
  loginForm.hidden = on;
  addForm.hidden = !on;
  logoutButton.hidden = !on;
  if (on) load(); else list.replaceChildren();
}
async function call(path, opt) {
  const sent = token();
  const res = await fetch(path, opt);
  const body = await res.json();
  const carried = opt.headers && opt.headers["Authorization"];
  if (res.status === 401 && carried && sent === token()) {
    localStorage.removeItem(key);
    signedIn(false);
  }
  if (!body.ok) status.textContent = body.error || "failed";
  return body;
}
function show(row) {
  const li = document.createElement("li");
  li.textContent = row.fields.title + " — " + row.fields.author + (row.fields.finished ? " (read)" : "");
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "Read";
  button.onclick = async () => {
    const body = await call("/data/books/update/" + row.id, {
      method: "PUT", headers: headers(true), body: JSON.stringify({ finished: true })
    });
    if (body.ok) load();
  };
  li.appendChild(button);
  list.appendChild(li);
}
async function load() {
  const body = await call("/data/books/list", { headers: headers() });
  if (!body.ok) return;
  status.textContent = "";
  list.replaceChildren();
  body.data.forEach(show);
}
loginForm.onsubmit = async (event) => {
  event.preventDefault();
  const body = await call("/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: loginForm.username.value, password: loginForm.password.value })
  });
  if (!body.ok) return;
  localStorage.setItem(key, body.data.token);
  status.textContent = "";
  signedIn(true);
};
logoutButton.onclick = async () => {
  await fetch("/auth/logout", { method: "POST", headers: headers() });
  localStorage.removeItem(key);
  status.textContent = "";
  signedIn(false);
};
addForm.onsubmit = async (event) => {
  event.preventDefault();
  const body = await call("/data/books/add", {
    method: "POST", headers: headers(true),
    body: JSON.stringify({ title: addForm.title.value, author: addForm.author.value })
  });
  if (!body.ok) return;
  addForm.reset();
  load();
};
signedIn(!!token());
</script>
</body>
</html>
