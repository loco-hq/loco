[package]
name = "loco-apps"
version = "0.1.0"
edition = "2021"

[lib]
name = "loco_apps"
path = "src/lib.rs"

[dependencies]
loco-schema-runtime = { path = "../loco-schema/crates/loco-schema-runtime" }
loco-lake = { path = "../loco-lake/crates/loco-lake" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_yaml = "0.9"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
loco-gen-schema = { path = "../loco-gen/crates/loco-gen-schema" }

# The local BrickLink mock (docs/brickos.md). `test = true` runs its tests
# under `cargo test`, so its bodies stay checked against the fixture shape.
[[example]]
name = "bricklink-mock"
test = true
