[package]
name = "loco-apps"
version = "0.1.0"
edition = "2021"

[dependencies]
loco-gen-runtime = { path = "../loco-gen/crates/loco-gen-runtime" }
loco-lake = { path = "../loco-lake/crates/loco-lake" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_yaml = "0.9"

[build-dependencies]
loco-gen-codegen-build = { path = "../loco-gen/crates/loco-gen-codegen-build" }
