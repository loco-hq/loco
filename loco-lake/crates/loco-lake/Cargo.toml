[package]
name = "loco-lake"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.40", features = ["bundled", "collation"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
